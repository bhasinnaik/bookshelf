<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf Manager</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📚 Bookshelf Manager</h1>
                <p class="tagline">Organize and manage your book collection</p>
            </div>
        </header>

        <!-- Navigation -->
        <nav class="nav">
            <button class="nav-btn active" data-tab="books">Books</button>
            <button class="nav-btn" data-tab="bookshelves">Bookshelves</button>
            <button class="nav-btn" data-tab="add-book">Add Book</button>
        </nav>
        <div id="mobileTabLabel" class="mobile-tab-label">All Books</div>

        <!-- Main Content -->
        <main id="app" class="main"></main>
    </div>

    <!-- Modal for Book Details -->
    <div id="bookModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- Modal for Shelf Details -->
    <div id="shelfModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="shelfModalBody"></div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/app.js"></script>
</body>
</html>
